<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volt</title>
    <meta
      name="description"
      content="Volt AI workspace with a premium chat UI, smart controls, and polished settings."
    />
    <style>
      :root {
        --bg: #f7f7f5;
        --sidebar: #f1f1ef;
        --surface: #ffffff;
        --surface-2: #f5f4f2;
        --text: #16181d;
        --text-soft: #4e5362;
        --muted: #7a7f8c;
        --border: #e7e3db;
        --strong-border: #d8d2c8;
        --accent: #4f46e5;
        --accent-rgb: 79, 70, 229;
        --accent-soft: #eeebff;
        --accent-strong: #4338ca;
        --success: #1bbf7b;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow-sm: 0 1px 2px rgba(14, 18, 35, 0.06);
        --shadow-md: 0 10px 28px rgba(17, 19, 35, 0.08);
        --radius: 16px;
        --radius-lg: 22px;
        --radius-pill: 999px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: Inter, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      button, input, select, textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        display: flex;
        min-height: 100vh;
        background: linear-gradient(180deg, rgba(79, 70, 229, 0.02), transparent 12%);
      }

      .sidebar {
        width: 280px;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        padding: 18px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px 10px;
      }

      .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark .logo {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), #7c6af6);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 800;
        font-size: 12px;
      }

      .brand-name {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      .icon-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--text-soft);
      }

      .new-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        font-weight: 700;
        padding: 12px 16px;
        box-shadow: var(--shadow-md);
      }

      .group-label {
        font-size: 11px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        padding: 10px 10px 2px;
        font-weight: 700;
      }

      .chat-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: auto;
      }

      .chat-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 10px;
        border-radius: 12px;
        border: 1px solid transparent;
        color: var(--text-soft);
      }

      .chat-item:hover {
        background: var(--surface);
        border-color: var(--border);
      }

      .chat-item.active {
        background: rgba(var(--accent-rgb), 0.08);
        color: var(--text);
        border-color: rgba(var(--accent-rgb), 0.18);
        box-shadow: inset 2px 0 0 var(--accent);
      }

      .chat-title {
        font-size: 0.96rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-actions {
        display: flex;
        gap: 4px;
        color: var(--muted);
      }

      .mini-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: inherit;
      }

      .mini-btn:hover {
        background: var(--surface-2);
        color: var(--accent);
      }

      .side-footer {
        margin-top: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 4px;
        box-shadow: var(--shadow-sm);
      }

      .foot-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        border: none;
        background: transparent;
        color: var(--text-soft);
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 600;
      }

      .foot-row:hover {
        background: rgba(var(--accent-rgb), 0.06);
        color: var(--accent);
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 24px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .slider {
        position: absolute;
        inset: 0;
        border-radius: var(--radius-pill);
        background: var(--strong-border);
        transition: background 0.2s ease;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 2px 6px rgba(16, 22, 38, 0.15);
        transition: transform 0.2s ease;
      }

      .switch input:checked + .slider {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      }

      .switch input:checked + .slider::before {
        transform: translateX(18px);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px rgba(27, 191, 123, 0.18);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .topbar {
        height: 64px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(12px);
      }

      .menu-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 12px;
        width: 36px;
        height: 36px;
        display: none;
        place-items: center;
      }

      .convo-title {
        font-size: 0.96rem;
        font-weight: 700;
        color: var(--text);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ghost-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-soft);
        border-radius: 12px;
        padding: 8px 12px;
        font-weight: 600;
      }

      .ghost-btn:hover {
        border-color: rgba(var(--accent-rgb), 0.3);
        color: var(--accent);
      }

      .chat-wrap {
        flex: 1;
        overflow: auto;
      }

      .conversation {
        max-width: 840px;
        margin: 0 auto;
        padding: 26px 24px 0;
      }

      .empty-state {
        padding: 36px 0 24px;
      }

      .empty-state h1 {
        margin: 0 0 8px;
        font-size: clamp(2.1rem, 3vw, 3rem);
        letter-spacing: -0.06em;
        line-height: 1.1;
      }

      .empty-state p {
        margin: 0;
        max-width: 44ch;
        color: var(--muted);
        font-size: 1rem;
      }

      .suggestions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 24px;
      }

      .suggestion {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 18px;
        padding: 16px 18px;
        text-align: left;
        color: var(--text-soft);
        box-shadow: var(--shadow-sm);
      }

      .suggestion:hover {
        border-color: rgba(var(--accent-rgb), 0.35);
        color: var(--text);
        transform: translateY(-1px);
      }

      .composer-wrap {
        padding: 0 24px 18px;
      }

      .composer-shell {
        max-width: 840px;
        margin: 0 auto;
      }

      .composer {
        position: relative;
        border: 1.5px solid var(--strong-border);
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        padding: 12px 12px 10px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .composer:focus-within {
        border-color: rgba(var(--accent-rgb), 0.5);
        box-shadow: 0 0 0 5px rgba(var(--accent-rgb), 0.08), var(--shadow-md);
      }

      .attach-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 0;
      }

      .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px 7px 12px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-soft);
        font-size: 0.85rem;
      }

      .file-chip button {
        border: none;
        background: transparent;
        color: var(--muted);
        width: 20px;
        height: 20px;
        border-radius: 50%;
      }

      .file-chip button:hover {
        background: rgba(239, 68, 68, 0.08);
        color: var(--danger);
      }

      textarea {
        width: 100%;
        min-height: 28px;
        max-height: 220px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 1.02rem;
        line-height: 1.6;
        padding: 10px 8px 8px;
      }

      textarea::placeholder {
        color: var(--muted);
      }

      textarea.invalid {
        box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.4);
        border-radius: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tool-bubble, .model-select {
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-soft);
        border-radius: var(--radius-pill);
        height: 36px;
        padding: 0 14px;
        font-weight: 600;
      }

      .tool-bubble {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .tool-bubble:hover,
      .model-select:hover {
        border-color: rgba(var(--accent-rgb), 0.35);
        color: var(--accent);
      }

      .model-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .model-wrap::after {
        content: "";
        position: absolute;
        right: 14px;
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--accent);
        border-bottom: 2px solid var(--accent);
        transform: rotate(45deg) translateY(-2px);
        pointer-events: none;
      }

      .model-select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 32px;
        min-width: 160px;
        background: var(--surface-2);
      }

      .tool-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .circle-btn {
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-soft);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }

      .circle-btn:hover {
        background: rgba(var(--accent-rgb), 0.06);
        color: var(--accent);
        border-color: rgba(var(--accent-rgb), 0.2);
      }

      .circle-btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        border: none;
        color: white;
        box-shadow: var(--shadow-md);
      }

      .circle-btn.primary:hover {
        background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      }

      .dimmer {
        text-align: center;
        color: var(--muted);
        font-size: 0.76rem;
        margin-top: 10px;
      }

      .switch-inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text-soft);
        font-weight: 700;
        font-size: 0.8rem;
      }

      .switch-inline:hover {
        border-color: rgba(var(--accent-rgb), 0.28);
        color: var(--text);
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid rgba(var(--accent-rgb), 0.22);
        background: rgba(var(--accent-rgb), 0.08);
        color: var(--accent);
        padding: 5px 10px;
        border-radius: var(--radius-pill);
        font-size: 0.76rem;
        font-weight: 700;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translate(-50%, 20px);
        background: rgba(22, 24, 29, 0.94);
        color: white;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 0.82rem;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 760px) {
        .sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          width: min(80vw, 300px);
          transform: translateX(-110%);
          transition: transform 0.2s ease;
          z-index: 50;
          box-shadow: var(--shadow-md);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .menu-btn {
          display: grid;
        }

        .suggestions {
          grid-template-columns: 1fr;
        }

        .topbar {
          padding: 0 12px;
        }

        .composer-wrap {
          padding: 0 12px 12px;
        }

        .conversation {
          padding-left: 14px;
          padding-right: 14px;
        }

        .tool-actions {
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <div class="logo">V</div>
            <div class="brand-name">Volt</div>
          </div>
          <button class="icon-btn" type="button" aria-label="More options">✦</button>
        </div>

        <button class="new-btn" type="button">+ New chat</button>

        <div class="group-label">Recent</div>
        <div class="chat-list">
          <div class="chat-item active">
            <span class="chat-title">Project launch plan</span>
            <div class="chat-actions">
              <button class="mini-btn" type="button" aria-label="Edit">✎</button>
              <button class="mini-btn" type="button" aria-label="Delete">⨯</button>
            </div>
          </div>
          <div class="chat-item">
            <span class="chat-title">Brand strategy review</span>
            <div class="chat-actions">
              <button class="mini-btn" type="button" aria-label="Edit">✎</button>
              <button class="mini-btn" type="button" aria-label="Delete">⨯</button>
            </div>
          </div>
          <div class="chat-item">
            <span class="chat-title">Design system ideas</span>
            <div class="chat-actions">
              <button class="mini-btn" type="button" aria-label="Edit">✎</button>
              <button class="mini-btn" type="button" aria-label="Delete">⨯</button>
            </div>
          </div>
        </div>

        <div class="side-footer">
          <button class="foot-row" type="button">
            <span>Thinking</span>
            <label class="switch" aria-label="Toggle thinking mode">
              <input type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </button>
          <div class="status">
            <span class="status-dot"></span>
            <span>Agent ready</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Open sidebar">☰</button>
          <div class="convo-title">Project launch plan</div>
          <div class="top-actions">
            <button class="ghost-btn" type="button">Share</button>
            <button class="ghost-btn" type="button">Settings</button>
          </div>
        </header>

        <div class="chat-wrap">
          <div class="conversation">
            <div class="empty-state">
              <h1>Build something polished.</h1>
              <p>
                Bring clarity to your next idea with a sharper workflow, better tools, and a cleaner AI workspace.
              </p>
              <div class="suggestions">
                <button class="suggestion" type="button">Map out a launch strategy for a new product</button>
                <button class="suggestion" type="button">Refine the UX copy for a premium onboarding flow</button>
                <button class="suggestion" type="button">Draft a landing page that feels calm, sharp, and modern</button>
                <button class="suggestion" type="button">Turn rough notes into a clean execution plan</button>
              </div>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="composer-shell">
            <div class="composer" aria-label="message composer">
              <div class="attach-row" aria-live="polite">
                <span class="file-chip">brief.md <button type="button" aria-label="Remove brief.md">×</button></span>
              </div>

              <textarea id="promptInput" placeholder="Type your message..." aria-label="Message input"></textarea>

              <div class="toolbar">
                <div class="toolbar-left">
                  <div class="status-chip">Auto</div>
                  <div class="switch-inline">
                    <span>Thinking</span>
                    <label class="switch" aria-label="Toggle thinking mode for this message">
                      <input type="checkbox" checked />
                      <span class="slider"></span>
                    </label>
                  </div>
                  <div class="model-wrap">
                    <select class="model-select" id="modelSelect" aria-label="Choose model">
                      <option value="cation">Cation</option>
                      <option value="auto" selected>Auto</option>
                      <option value="gpt-4.1">GPT-4.1</option>
                      <option value="claude-3-7">Claude 3.7</option>
                      <option value="gemini-2.5">Gemini 2.5</option>
                    </select>
                  </div>
                </div>

                <div class="tool-actions">
                  <button class="circle-btn" type="button" aria-label="Add attachment">＋</button>
                  <button class="circle-btn" type="button" aria-label="Voice input">◉</button>
                  <button class="circle-btn primary" type="button" aria-label="Send message">➤</button>
                </div>
              </div>
            </div>
            <div class="dimmer">Use Shift + Enter for a new line.</div>
          </div>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite">Saved</div>

    <script>
      const select = document.getElementById('modelSelect');
      const autoOption = [...select.options].find((option) => option.value.toLowerCase() === 'auto');
      const cationOption = [...select.options].find((option) => option.value.toLowerCase() === 'cation');

      if (cationOption && autoOption) {
        const cationIndex = [...select.options].indexOf(cationOption);
        const autoIndex = [...select.options].indexOf(autoOption);
        if (cationIndex > autoIndex) {
          select.insertBefore(cationOption, autoOption);
        }
      }

      const promptInput = document.getElementById('promptInput');
      const autoResize = () => {
        promptInput.style.height = 'auto';
        promptInput.style.height = Math.min(promptInput.scrollHeight, 220) + 'px';
      };

      promptInput.addEventListener('input', autoResize);
      promptInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          const toast = document.getElementById('toast');
          toast.textContent = 'Message sent';
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 1200);
        }
      });
      autoResize();

      document.querySelectorAll('.switch input').forEach((input) => {
        const sync = () => {
          input.setAttribute('aria-checked', String(input.checked));
          input.closest('label')?.classList.toggle('is-on', input.checked);
        };
        input.addEventListener('change', sync);
        sync();
      });

      document.getElementById('menuBtn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });
    </script>
  </body>
</html>
