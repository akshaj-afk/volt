<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Volt</title>
<meta name="description" content="Volt: a free AI assistant with reasoning, code, math, diagrams and voice." />
<meta name="theme-color" content="#1f3c88" />
<link rel="icon" type="image/png" href="volt.png" />
<link rel="apple-touch-icon" href="volt.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
<style>
  :root {
    --font-ui: "Hanken Grotesk", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    --font-serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --bg: #f5f5f0;
    --sidebar: #e8ecf4;
    --surface: #ffffff;
    --surface-2: #faf9f6;
    --user: #e3e9f6;
    --text: #1d1d1b;
    --text-2: #4a4a46;
    --muted: #8a8880;
    --border: #e2e0d8;
    --border-strong: #cfcdc3;
    --hover: #e5e3dc;
    --accent: #1f3c88;
    --accent-hover: #172f6b;
    --accent-soft: #e4eaf7;
    --danger: #c2413a;
    --code-bg: #f3f2ee;
    --shadow-sm: 0 1px 2px rgba(28,26,20,.04);
    --shadow-md: 0 2px 6px rgba(28,26,20,.06), 0 12px 32px -8px rgba(28,26,20,.12);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #101216;
    --sidebar: #0c0e12;
    --surface: #171a21;
    --surface-2: #1b1f28;
    --user: #1c2435;
    --text: #ecebe6;
    --text-2: #c4c3bd;
    --muted: #85847d;
    --border: #262a34;
    --border-strong: #353a46;
    --hover: #1d2129;
    --accent: #8fa9e8;
    --accent-hover: #b0c4f2;
    --accent-soft: #18233d;
    --danger: #e0716a;
    --code-bg: #0c0e13;
    --shadow-sm: none;
    --shadow-md: 0 12px 32px -8px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  textarea:focus-visible, input:focus-visible, select:focus-visible { outline: none; }
  ::selection { background: var(--accent-soft); }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-track { background: transparent; }

  .app { display: flex; height: 100%; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 264px; flex-shrink: 0; background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 14px 12px 12px;
    transition: transform .25s ease;
  }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 16px; }
  .logo { height: 32px; width: auto; display: block; object-fit: contain; }
  .icon-btn {
    background: none; border: 0; border-radius: 8px; padding: 6px; color: var(--muted);
    display: grid; place-items: center; transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .new-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-weight: 500; font-size: 14.5px; box-shadow: var(--shadow-sm);
    transition: border-color .15s, transform .15s;
  }
  .new-btn:hover { border-color: var(--border-strong); }
  .new-btn svg { width: 16px; height: 16px; stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; }

  .list { flex: 1; overflow-y: auto; margin: 10px -4px 0; padding: 0 4px; }
  .group-label { font-size: 12px; font-weight: 500; color: var(--muted); padding: 14px 10px 6px; letter-spacing: .01em; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-2);
    transition: background .12s;
  }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); border: 1px solid var(--border); padding: 6px 9px; }
  .item span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .del {
    opacity: 0; background: none; border: 0; color: var(--muted); border-radius: 6px; padding: 3px; line-height: 0;
  }
  .item:hover .del { opacity: 1; }
  .item .del:hover { color: var(--danger); background: var(--hover); }
  .item .del svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
  .empty-list { font-size: 13px; color: var(--muted); padding: 10px; }

  .side-foot { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .foot-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--text-2);
    background: none; border: 0; width: 100%; text-align: left;
  }
  .foot-row:hover { background: var(--hover); color: var(--text); }
  .switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .slider { position: absolute; inset: 0; background: var(--border-strong); border-radius: 20px; transition: background .2s; }
  .slider::before { content: ""; position: absolute; width: 15px; height: 15px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(15px); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 8px 10px 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3f9a5f; flex-shrink: 0; }
  .dot.off { background: var(--danger); }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; flex-shrink: 0; }
  .menu-toggle { display: none; }
  .convo-title {
    font-size: 14px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500; min-width: 0;
  }

  .chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .col { max-width: 760px; margin: 0 auto; padding: 28px 28px 16px; min-height: 100%; }

  /* Empty state */
  .empty { margin-top: 12vh; }
  .empty .eyebrow { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; }
  .empty h1 { font-family: var(--font-serif); font-weight: 400; font-size: 44px; line-height: 1.12; letter-spacing: -.02em; margin: 0 0 10px; }
  .empty p { color: var(--muted); margin: 0 0 30px; font-size: 16px; }
  .suggest { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .suggest button {
    text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; font-size: 14px; color: var(--text-2); line-height: 1.45;
    transition: border-color .15s, color .15s, transform .15s;
  }
  .suggest button:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }

  /* Messages */
  .msg { margin: 0 0 28px; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user); border: 1px solid transparent; border-radius: 18px 18px 4px 18px;
    padding: 10px 16px; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; color: var(--text);
  }
  .msg.assistant .body { overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.75; color: var(--text); }
  .msg.assistant .text { white-space: pre-wrap; }
  .msg.assistant .text h2, .msg.assistant .text h3, .msg.assistant .text h4 {
    font-family: var(--font-serif); font-weight: 500; margin: 18px 0 6px; line-height: 1.25; white-space: normal; letter-spacing: -.01em;
  }
  .msg.assistant .text h2 { font-size: 1.5em; }
  .msg.assistant .text h3 { font-size: 1.28em; }
  .msg.assistant .text h4 { font-size: 1.1em; }
  .msg.assistant ul { margin: 8px 0; padding-left: 22px; white-space: normal; }
  .msg.assistant li { margin: 5px 0; }
  .msg.assistant li::marker { color: var(--muted); }
  .msg.assistant code {
    background: var(--code-bg); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px;
    font-size: .86em; font-family: var(--font-mono); white-space: normal;
  }
  .code { margin: 14px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--code-bg); white-space: normal; }
  .code-head {
    display: flex; justify-content: space-between; align-items: center; padding: 7px 12px 7px 14px;
    font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); font-family: var(--font-mono);
  }
  .code-head button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 9px;
    font-size: 12px; color: var(--muted); font-family: var(--font-ui);
  }
  .code-head button:hover { color: var(--accent); border-color: var(--accent); }
  .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .code code { background: none; border: 0; padding: 0; font-size: 13.2px; line-height: 1.6; font-family: var(--font-mono); }

  details.think { margin-bottom: 12px; color: var(--muted); }
  details.think summary {
    cursor: pointer; font-size: 13px; user-select: none; list-style: none; display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); padding: 3px 0;
  }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .7;
  }
  details.think summary:hover { color: var(--text-2); }
  details.think > div {
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.65; margin: 6px 0 4px;
    padding: 4px 0 4px 14px; border-left: 1px solid var(--border-strong);
  }

  .actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
  .msg.assistant.done .actions, .msg.assistant:hover .actions { opacity: 1; }
  .actions button {
    background: none; border: 0; color: var(--muted); padding: 5px 6px; border-radius: 7px; line-height: 0;
  }
  .actions button:hover { background: var(--hover); color: var(--text); }
  .actions button.on { color: var(--accent); }
  .actions svg, .circle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .typing { display: inline-flex; gap: 4px; padding: 8px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: .3; } 40% { transform: translateY(-3px); opacity: 1; } }

  /* Composer */
  .composer-wrap { padding: 0 28px 12px; }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .speaking {
    display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--accent);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 6px 5px 14px; width: fit-content; margin: 0 auto 10px; box-shadow: var(--shadow-sm);
  }
  .speaking.show { display: flex; }
  .speaking button {
    background: var(--accent-soft); border: 0; border-radius: 999px; padding: 3px 11px; color: var(--accent); font-size: 12.5px; font-weight: 500;
  }
  .wave { display: flex; gap: 3px; align-items: center; height: 13px; }
  .wave i { width: 2.5px; height: 100%; background: var(--accent); border-radius: 2px; animation: wave 1s infinite ease-in-out; }
  .wave i:nth-child(2) { animation-delay: .15s; } .wave i:nth-child(3) { animation-delay: .3s; }
  @keyframes wave { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }

  .composer {
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 18px;
    box-shadow: var(--shadow-md); padding: 12px 12px 9px; transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); }
  .composer textarea {
    width: 100%; background: transparent; border: 0; outline: none; resize: none;
    font-family: var(--font-ui); font-size: 15.5px; line-height: 1.55; color: var(--text);
    min-height: 26px; max-height: 220px; padding: 4px 6px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
  .model-wrap { position: relative; display: inline-flex; align-items: center; }
  .model-wrap::after {
    content: ""; position: absolute; right: 10px; pointer-events: none; width: 6px; height: 6px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px);
  }
  .model-select {
    appearance: none; -webkit-appearance: none; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; font-weight: 500; padding: 6px 28px 6px 10px; border-radius: 9px;
    outline: none; max-width: 260px; cursor: pointer;
  }
  .model-select:hover { border-color: var(--border-strong); color: var(--text); }
  .model-select option, .model-select optgroup { background: var(--surface); color: var(--text); }
  .tools { display: flex; align-items: center; gap: 6px; }
  .circle {
    width: 34px; height: 34px; border-radius: 10px; border: 0; display: grid; place-items: center;
    background: none; color: var(--muted); transition: background .15s, color .15s, transform .1s;
  }
  .circle:hover { background: var(--hover); color: var(--text); }
  .circle:active { transform: scale(.96); }
  .circle.mic.on { background: var(--danger); color: #fff; animation: pulse 1.3s infinite; }
  .circle.send { background: var(--accent); color: #fff; }
  .circle.send:hover { background: var(--accent-hover); }
  .circle.send:disabled { opacity: .35; cursor: default; }
  .circle.send.stop { background: var(--text); color: var(--bg); }
  .circle svg { stroke-width: 2.1; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(194,65,58,.45); } 100% { box-shadow: 0 0 0 9px rgba(194,65,58,0); } }
  .disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

  .left-tools { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .tools-menu { position: relative; }
  .plus-btn { border: 1px solid var(--border); background: var(--surface-2); }
  .plus-btn.open { background: var(--hover); color: var(--text); }
  .popover {
    position: absolute; bottom: calc(100% + 10px); left: 0; width: 280px; z-index: 40;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px;
    box-shadow: var(--shadow-md); padding: 6px; display: none;
  }
  .popover.open { display: block; animation: rise .15s ease; }
  .pop-label { font-size: 11px; color: var(--muted); padding: 10px 10px 4px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .pop-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    padding: 8px 10px; border-radius: 9px; background: none; border: 0; text-align: left;
    font-size: 14px; color: var(--text-2);
  }
  .pop-item:hover { background: var(--hover); color: var(--text); }
  .pop-item .sub { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .pop-item .check { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 2.2; flex-shrink: 0; opacity: 0; }
  .pop-item.active { color: var(--text); }
  .pop-item.active .check { opacity: 1; }
  .pop-item.disabled { opacity: .5; pointer-events: none; }
  .pop-item .switch { pointer-events: none; }
  .pop-divider { height: 1px; background: var(--border); margin: 6px 4px; }
  .state-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500;
    padding: 4px 6px 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); border: 0;
  }
  .pill button { background: none; border: 0; color: inherit; line-height: 0; padding: 2px; border-radius: 4px; opacity: .7; }
  .pill button:hover { opacity: 1; background: rgba(0,0,0,.06); }
  .pill button svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .attach-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 8px; }
  .attach-row:empty { display: none; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 5px 6px 5px 10px; font-size: 12.5px; color: var(--text-2); max-width: 260px;
  }
  .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip button { background: none; border: 0; color: var(--muted); line-height: 0; padding: 2px; border-radius: 4px; }
  .file-chip button:hover { color: var(--danger); }
  .file-chip button svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .msg.user .bubble .file-line { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }

  .copyright { font-size: 11.5px; color: var(--muted); text-align: center; padding: 10px 6px 2px; letter-spacing: .01em; }

  /* ---------- Ink decorations ---------- */
  .chat {
    background-image: radial-gradient(circle at 1px 1px, rgba(31,60,136,.10) 1px, transparent 0);
    background-size: 22px 22px;
  }
  [data-theme="dark"] .chat {
    background-image: radial-gradient(circle at 1px 1px, rgba(143,169,232,.09) 1px, transparent 0);
  }
  .topbar { border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
  .topbar::after { content: none; }
  .sidebar { box-shadow: inset -1px 0 0 rgba(31,60,136,.06); }
  .brand { position: relative; }
  .brand::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 6px; height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent 80%); opacity: .35;
  }
  .item.active { box-shadow: inset 2px 0 0 var(--accent), var(--shadow-sm); }
  .new-btn { border-color: color-mix(in srgb, var(--accent) 25%, var(--border)); color: var(--accent); }
  .new-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .new-btn svg { stroke: var(--accent); }

  .empty .eyebrow { text-align: center; color: var(--accent); }
  .empty h1 { text-align: center; color: var(--text); }
  .empty p { text-align: center; }
  .suggest button {
    position: relative; overflow: hidden; background: var(--surface);
    border-color: color-mix(in srgb, var(--accent) 18%, var(--border));
  }
  .suggest button::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
    transform: scaleY(0); transform-origin: top; transition: transform .2s ease;
  }
  .suggest button:hover { background: var(--accent-soft); }
  .suggest button:hover::before { transform: scaleY(1); }
  .suggest em {
    display: block; font-family: var(--font-serif); font-style: italic; color: var(--accent);
    font-size: 13px; margin-bottom: 4px;
  }

  .msg.user .bubble { border-color: color-mix(in srgb, var(--accent) 14%, transparent); }
  .msg.assistant .text h2, .msg.assistant .text h3, .msg.assistant .text h4 { color: var(--accent); }
  .msg.assistant .text h2::before { content: "\2766\00a0"; color: var(--muted); font-size: .8em; }
  .msg.assistant a { color: var(--accent); }
  .msg.assistant strong { color: var(--text); font-weight: 650; }
  .composer { border-color: color-mix(in srgb, var(--accent) 28%, var(--border)); box-shadow: 0 0 0 1px rgba(31,60,136,.03), var(--shadow-md); }
  .composer:focus-within { border-color: var(--accent); }

  .circle.send:hover { background: linear-gradient(160deg, #22438f, var(--accent-hover)); }
  .model-select { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 22%, var(--border)); }
  .pop-label { color: var(--accent); }
  .pop-item.active { background: var(--accent-soft); }
  .pill { border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); }

  .main-footer {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--accent);
    opacity: .85; margin: 10px 0 0; padding: 0; letter-spacing: .01em;

  .main-footer::before, .main-footer::after {
    content: ""; width: 36px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent));

  .copyright::before, .copyright::after { content: none; }

  .scrim { display: none; }

  /* ---------- Final restraint: plain, editorial, less decorative ---------- */
  .chat { background-image: none; }
  .topbar { background: var(--bg); backdrop-filter: none; border-bottom: 0; }
  .sidebar { box-shadow: none; }
  .brand::after { content: none; }
  .item.active { background: var(--hover); box-shadow: none; border: 0; padding: 7px 10px; }

  .empty { margin-top: 10vh; text-align: left; }

  .suggest button {
    background: none; border: 0; border-bottom: 1px solid var(--border); border-radius: 0;

  .msg { animation: none; }
  .msg.user .bubble { border: 1px solid var(--border); border-radius: 12px; }

  .msg.assistant .text h2::before { content: none; }

  .composer { box-shadow: none; border-color: var(--border-strong); border-radius: 14px; }
  .composer:focus-within { box-shadow: 0 0 0 1px var(--accent); border-color: var(--accent); }
  .circle.send, .circle.send:hover { background: var(--accent); box-shadow: none; }
  .model-select { color: var(--text-2); border-color: var(--border); }
  .model-select:hover { color: var(--text); }
  .pill { border: 0; }
  .pop-label { color: var(--muted); }
  .pop-item.active { background: var(--hover); }

  .main-footer { font-family: var(--font-ui); font-style: normal; font-size: 12px; color: var(--muted); opacity: 1; letter-spacing: 0; }
  .main-footer::before, .main-footer::after { content: none; }

  /* ---------- Math, diagrams, chat tools, dialogs ---------- */
  .tex[data-display="1"] { display: block; text-align: center; margin: 1em 0; overflow-x: auto; }
  .katex { font-size: 1.05em; }
  .mermaid-box { margin: 14px 0; overflow-x: auto; text-align: center; }
  .mermaid-box svg { max-width: 100%; height: auto; }
  .mmd-error { text-align: left; color: var(--danger); background: var(--code-bg); padding: 10px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; }
  .imgs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }
  .imgs img { max-width: 220px; max-height: 180px; border-radius: 10px; border: 1px solid var(--border); object-fit: cover; }

  .user-col .bubble { max-width: 100%; }
  .user-actions { opacity: 0; transition: opacity .15s; display: flex; gap: 4px; margin-top: 4px; }
  .msg.user:hover .user-actions { opacity: 1; }
  .textbtn { background: none; border: 0; color: var(--muted); font-size: 12.5px; padding: 5px 7px; border-radius: 7px; }
  .textbtn:hover { background: var(--hover); color: var(--text); }
  .actions .model-tag { font-size: 12px; color: var(--muted); align-self: center; margin-left: 8px; }
  .top-actions { margin-left: auto; display: flex; gap: 2px; }
  .search {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 10px; font: inherit; font-size: 13.5px; color: var(--text); outline: none; margin-top: 10px;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }
  .item-tools { display: flex; gap: 2px; opacity: 0; }
  .item:hover .item-tools { opacity: 1; }
  .item .ico { background: none; border: 0; color: var(--muted); padding: 3px; border-radius: 6px; line-height: 0; }
  .item .ico:hover { color: var(--accent); background: var(--hover); }
  .item .ico svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .menu-pop {
    position: fixed; z-index: 60; width: 260px; max-height: 300px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow-md); padding: 6px;
  }
  .menu-pop[hidden] { display: none; }
  dialog.sheet {
    border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); color: var(--text);
    padding: 22px 22px 18px; width: min(460px, 92vw); box-shadow: var(--shadow-md);
  }
  dialog.sheet::backdrop { background: rgba(10, 12, 20, .35); }
  dialog.sheet h3 { margin: 0 0 14px; font-family: var(--font-serif); font-weight: 500; font-size: 22px; }
  dialog.sheet label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
  dialog.sheet input, dialog.sheet textarea {
    display: block; width: 100%; margin-top: 5px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 14px; color: var(--text); outline: none;
  }
  dialog.sheet input:focus, dialog.sheet textarea:focus { border-color: var(--accent); }
  dialog.sheet textarea { resize: vertical; }
  .sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .sheet-actions .spacer { flex: 1; }
  .sheet-actions button { font-size: 13.5px; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); }
  .sheet-actions .primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .sheet-actions .danger { color: var(--danger); }
  .sheet-actions button[hidden] { display: none; }

  /* ---------- File cards ---------- */
  .file-card {
    display: flex; align-items: center; gap: 12px; margin: 14px 0 8px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 520px;
  }
  .file-badge {
    width: 40px; height: 46px; flex-shrink: 0; border-radius: 7px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .05em;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-name { font-weight: 600; font-size: 14.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .file-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .file-actions button {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px;
    font-size: 12.5px; font-weight: 500; color: var(--text-2);
  }
  .file-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .file-src { margin: 0 0 14px; max-width: 760px; }
  .file-src summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 2px 0 6px; user-select: none; }
  .file-src summary:hover { color: var(--text-2); }
  .file-src .code { margin: 0; }

  /* ---------- Thinking toggle ---------- */
  .think-toggle {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
    color: var(--text-2); padding: 5px 8px; border-radius: 9px; cursor: pointer; user-select: none;
    border: 1px solid var(--border); background: var(--surface-2); white-space: nowrap;
  }
  .think-toggle:hover { border-color: var(--border-strong); color: var(--text); }
  .think-toggle .switch { width: 30px; height: 17px; }
  .think-toggle .slider::before { width: 13px; height: 13px; }
  .think-toggle .switch input:checked + .slider::before { transform: translateX(13px); }
  .think-toggle input { pointer-events: none; }

  /* ---------- Rich markdown ---------- */
  .md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .9em; }
  .md a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .md a:hover { color: var(--accent-hover); }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--font-ui); font-weight: 600; line-height: 1.3; margin: 1.3em 0 .5em; color: var(--text); }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.06em; }
  .md h4 { font-size: 1em; }
  .md ul, .md ol { padding-left: 1.45em; margin: .4em 0 .9em; }
  .md li { margin: .3em 0; }
  .md li > p { margin: 0; }
  .md li::marker { color: var(--muted); }
  .md blockquote { margin: .9em 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--accent); color: var(--text-2); }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
  .md strong { font-weight: 600; color: var(--text); }
  .md img { max-width: 100%; border-radius: 10px; }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; width: 100%; margin: .9em 0; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--surface-2); font-weight: 600; }
  .msg.assistant .code code { background: none; border: 0; padding: 0; font-size: 13.2px; }
  .code code.hljs { display: block; }
  .hljs { background: transparent; color: var(--text); }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-built_in, .hljs-name { color: var(--accent); font-weight: 500; }
  .hljs-string, .hljs-template-string, .hljs-regexp { color: #2e7d4f; }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: #b35c1e; }
  .hljs-comment, .hljs-quote, .hljs-doctag { color: var(--muted); font-style: italic; }
  .hljs-title, .hljs-title.function_, .hljs-section { color: #5b3f9e; }
  .hljs-title.class_, .hljs-type { color: #0f6b7a; }
  .hljs-attr, .hljs-variable, .hljs-property, .hljs-params { color: #7a5a1a; }
  .hljs-tag, .hljs-meta { color: var(--muted); }
  .hljs-addition { color: #2e7d4f; background: rgba(46,125,79,.08); }
  .hljs-deletion { color: #b3302a; background: rgba(179,48,42,.08); }
  [data-theme="dark"] .hljs-keyword, [data-theme="dark"] .hljs-selector-tag, [data-theme="dark"] .hljs-literal,
  [data-theme="dark"] .hljs-built_in, [data-theme="dark"] .hljs-name { color: #8fa9e8; }
  [data-theme="dark"] .hljs-string, [data-theme="dark"] .hljs-template-string { color: #86cf9f; }
  [data-theme="dark"] .hljs-number, [data-theme="dark"] .hljs-symbol { color: #e8a878; }
  [data-theme="dark"] .hljs-title, [data-theme="dark"] .hljs-section { color: #c3a6f2; }
  [data-theme="dark"] .hljs-title.class_, [data-theme="dark"] .hljs-type { color: #7fd0dc; }
  [data-theme="dark"] .hljs-attr, [data-theme="dark"] .hljs-variable, [data-theme="dark"] .hljs-property { color: #e6cf8a; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .sidebar { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; transform: translateX(-102%); box-shadow: var(--shadow-md); }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: grid; }
    .scrim { display: block; position: fixed; inset: 0; background: rgba(10,10,10,.28); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .empty h1 { font-size: 34px; }
    .suggest { grid-template-columns: 1fr; }
    .composer-wrap { padding: 0 12px 10px; }
    .col { padding: 20px 16px 12px; }
  }

  /* ---------- Mobile and touch ---------- */
  html, body, .app { height: 100dvh; }
  .chat { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .circle, .icon-btn, .new-btn, .foot-row, .pop-item, .item { min-height: 40px; }

  /* Touch devices have no hover, so hover-only controls stay visible */
  @media (hover: none) {
    .actions, .user-actions, .item-tools { opacity: 1; }
    .actions button { padding: 8px 9px; }
    .item { padding: 10px; }
    .item .ico { padding: 7px; }
    .item .ico svg { width: 15px; height: 15px; }
  }

  @media (max-width: 860px) {
    /* Stop iOS from zooming in on focus */
    .composer textarea, .search, .model-select,
    dialog.sheet input, dialog.sheet textarea { font-size: 16px; }

    .sidebar {
      width: min(84vw, 300px);
      height: 100dvh;
      padding-top: calc(14px + env(safe-area-inset-top));
      padding-left: calc(12px + env(safe-area-inset-left));
    }
    .topbar {
      height: auto; min-height: 56px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      flex-wrap: nowrap;
    }
    .convo-title { flex: 1; min-width: 0; font-size: 15px; }
    .top-actions { display: none; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; }

    .col { padding: 16px 14px 10px; }
    .empty { margin-top: 4vh; }
    .empty h1 { font-size: 28px; }
    .empty p { font-size: 15px; margin-bottom: 18px; }
    .suggest button { font-size: 15px; padding: 12px 2px; }

    .msg { margin-bottom: 22px; }
    .msg.user .bubble, .msg.user .user-col { max-width: 100%; }
    .msg.assistant .body { font-size: 16px; }
    .actions { flex-wrap: wrap; opacity: 1; }
    .actions .model-tag { margin-left: 2px; }
    .file-card { max-width: 100%; }
    .file-actions button { padding: 8px 12px; }
    .imgs img { max-width: 60vw; }
    .md table { font-size: 13px; }

    .composer-wrap { padding: 0 10px calc(8px + env(safe-area-inset-bottom)); }
    .composer { padding: 10px 10px 8px; border-radius: 16px; }
    .composer textarea { max-height: 40vh; }
    .toolbar { gap: 6px; }
    .left-tools { gap: 5px; flex: 1; min-width: 0; }
    .model-select { max-width: 150px; padding-right: 26px; }
    .think-toggle { padding: 6px 7px; font-size: 12.5px; }
    .think-toggle .switch { width: 28px; }
    .circle { width: 40px; height: 40px; }
    .tools { gap: 4px; }
    .state-pills { display: none; }
    .disclaimer { font-size: 11px; margin-top: 6px; }
    .main-footer { font-size: 11px; }

    /* Popovers open above the composer, full width */
    .popover {
      position: fixed; left: 10px; right: 10px; width: auto;
      bottom: calc(150px + env(safe-area-inset-bottom)); max-height: 60vh; overflow-y: auto;
    }
    .menu-pop { width: min(260px, calc(100vw - 20px)); }
    dialog.sheet { width: calc(100vw - 24px); padding: 18px; }
    .sheet-actions { flex-wrap: wrap; }
  }

  @media (max-width: 380px) {
    .model-select { max-width: 120px; }
    .think-toggle span:first-child { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Volt needs JavaScript to run.</p></noscript>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="volt.png" alt="Volt" />
      
      <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <button class="new-btn" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <input type="search" id="chatSearch" class="search" placeholder="Search chats" />
    <div class="list" id="list"></div>

    <div class="side-foot">
      <label class="foot-row">
        <span>Read replies aloud</span>
        <span class="switch"><input type="checkbox" id="speakToggle" /><span class="slider"></span></span>
      </label>
      <label class="foot-row">
        <span>Show reasoning</span>
        <span class="switch"><input type="checkbox" id="reasonToggle" /><span class="slider"></span></span>
      </label>
      <button class="foot-row" id="themeBtn"><span id="themeLabel">Dark mode</span><span id="themeIcon" style="display:grid"></span></button>
    </div>
    <footer class="copyright">© MANEX 2026. All Rights Reserved.</footer>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="convo-title" id="title">New chat</div>
      <div class="top-actions">
        <button class="textbtn" id="exportMd" title="Export this chat as Markdown">Export .md</button>
        <button class="textbtn" id="exportJson" title="Export this chat as JSON">Export .json</button>
      </div>
    </header>

    <div class="chat" id="chat"><div class="col" id="col"></div></div>

    <div class="composer-wrap">
      <div class="composer-inner">
        <div class="speaking" id="speaking">
          <div class="wave"><i></i><i></i><i></i></div>
          <span>Reading aloud</span>
          <button id="stopSpeak">Stop</button>
        </div>
        <div class="composer">
          <div class="attach-row" id="attachRow"></div>
          <input type="file" id="fileInput" multiple hidden
            accept="image/*,.txt,.md,.csv,.json,.js,.ts,.jsx,.tsx,.py,.html,.css,.xml,.yaml,.yml,.log,.sql,.java,.c,.cpp,.h,.go,.rs,.rb,.php,.sh" />
          <textarea id="input" rows="1" placeholder="Message Volt"></textarea>
          <div class="toolbar">
            <div class="left-tools">
              <div class="tools-menu">
                <button class="circle plus-btn" id="plusBtn" title="Connectors and skills" aria-label="Connectors and skills">
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <div class="popover" id="popover"></div>
              </div>
              <div class="model-wrap">
                <select class="model-select" id="model" title="Choose model"></select>
              </div>
              <label class="think-toggle" title="When on, Volt reasons more carefully and writes longer answers">
                <span>Thinking</span>
                <span class="switch"><input type="checkbox" id="thinkToggle" /><span class="slider"></span></span>
              </label>
              <div class="state-pills" id="statePills"></div>
            </div>
            <div class="tools">
              <button class="circle mic" id="micBtn" title="Voice input" aria-label="Voice input">
                <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
              </button>
              <button class="circle send" id="sendBtn" title="Send" aria-label="Send">
                <svg viewBox="0 0 24 24" id="sendIcon"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="disclaimer">Volt can make mistakes. Check important information.</div>
        <footer class="main-footer">© MANEX 2026. All Rights Reserved.</footer>
      </div>
    </div>
  </main>
<dialog id="skillDialog" class="sheet">
  <h3 id="skillTitle">Create a skill</h3>
  <label>Name<input id="skName" maxlength="40" placeholder="e.g. Meeting notes" /></label>
  <label>Description<input id="skDesc" maxlength="80" placeholder="What it is for" /></label>
  <label>Instructions<textarea id="skPrompt" rows="6" placeholder="How should Volt respond when this skill is active?"></textarea></label>
  <div class="sheet-actions">
    <button id="skDelete" class="danger" hidden>Delete</button>
    <span class="spacer"></span>
    <button id="skCancel">Cancel</button>
    <button id="skSave" class="primary">Save skill</button>
  </div>
</dialog>
<div class="menu-pop" id="menuPop" hidden></div>
</div>

<script>
/* The OpenRouter key is NOT in this file. It lives in Vercel as
   OPENROUTER_API_KEY and is used only by api/chat.js on the server. */

const BASE_PROMPT = `You are Volt, a smart, friendly and capable AI assistant.

async function loadFreeModels() {
  try {
    const r = await fetch('https://openrouter.ai/api/v1/models');
    if (!r.ok) throw new Error('catalogue unavailable');
    const { data } = await r.json();
    const free = data
      .filter(m => m.id.endsWith(':free'))
      .map(m => ({ group: groupForModel(m), id: m.id, name: (m.name || m.id).replace(/^[^:]*:\s*/, '') }))
      .sort((a, b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name));
    if (free.length) {
      MODELS.length = 0;
      MODELS.push(AUTO_MODEL, ...free);

  // Drop a saved model that is no longer free or listed
  if (prefs.model && !MODELS.some(m => m.id === prefs.model)) {
    prefs.model = AUTO_MODEL.id;

function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inline(t) {
  return t

    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')

    .replace(/<\/li>\n/g, '</li>');
}

function highlightCode(raw, lang) {
  let out = esc(raw);
  if (window.hljs) {

}
const fileStore = new Map();
function fileId(name, text) {
  let h = 0;
  const s = name + '\u0000' + text;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return 'f' + (h >>> 0).toString(36) + '_' + s.length;
}

function md(text) {
  if (!(window.marked && window.DOMPurify)) return mdFallback(text);

function mdFallback(text) {
  return text.split('```').map((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf('\n');
      let lang = '', code = part;
      if (nl > -1 && /^[\w+#.\-]*$/.test(part.slice(0, nl).trim())) { lang = part.slice(0, nl).trim(); code = part.slice(nl + 1); }
      return `<div class="code"><div class="code-head"><span>${esc(lang || 'code')}</span>` +
        `<button data-act="copycode">Copy</button></div><pre><code>${esc(code.replace(/\n$/, ''))}</code></pre></div>`;

}

function dateGroup(ts) {
  const now = new Date();
  const d = new Date(ts);
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const day = 86400000;
  if (ts >= startToday) return 'Today';
  if (ts >= startToday - day) return 'Yesterday';
  if (ts >= startToday - 7 * day) return 'Previous 7 days';
  if (ts >= startToday - 30 * day) return 'Previous 30 days';
  return d.toLocaleString(undefined, { month: 'long', year: 'numeric' });
}

  if (act === 'othermodel' && msgEl) return showModelMenu(+msgEl.dataset.index, btn);
  if (act === 'fdownload' && fileStore.has(btn.dataset.fid)) downloadFile(fileStore.get(btn.dataset.fid));
  if (act === 'fcopy' && fileStore.has(btn.dataset.fid)) {
    await navigator.clipboard.writeText(fileStore.get(btn.dataset.fid).text);
    const old = btn.textContent; btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = old, 1400);
  }

  if (act === 'copy' && m) { await navigator.clipboard.writeText(m.content); flash(btn, ICONS.check); }
  if (act === 'copycode') {
    const txt = btn.closest('.code').querySelector('code').innerText;
    await navigator.clipboard.writeText(txt); btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 1400);
  }
  if (act === 'speak' && m) speak(m.content, true);
  if (act === 'retry' && m && !busy) regenerate(+msgEl.dataset.index);
});
function flash(btn, icon) {
  const old = btn.innerHTML;
  btn.innerHTML = icon; btn.classList.add('on');
  setTimeout(() => { btn.innerHTML = old; btn.classList.remove('on'); }, 1300);
}

els.list.addEventListener('click', e => {

  const del = e.target.closest('[data-del]');

/* ============================ SENDING ============================ */
function setBusy(v) {
  busy = v;
  els.send.classList.toggle('stop', v);

  els.send.title = v ? 'Stop' : 'Send';

async function streamInto(assistantMsg, bodyEl) {
  const c = current();
  const payloadMessages = c.messages
    .filter(m => m !== assistantMsg && m.content && !m.error)
    .map(({ role, content, images }) => images?.length
      ? { role, content: [{ type: 'text', text: content }, ...images.map(url => ({ type: 'image_url', image_url: { url } }))] }
      : { role, content });

  const useModel = oneShotModel || selectedModel();
  oneShotModel = null;
  assistantMsg.model = useModel;
  abortCtrl = new AbortController();

  // Calls our own serverless route, which adds the secret key on the server.
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: useModel,
      stream: true,
      reasoning: prefs.thinking === true ? { effort: 'high' } : { enabled: false },
      messages: [{ role: 'system', content: buildSystemPrompt() }, ...payloadMessages]
    }),
    signal: abortCtrl.signal
  });

  if (!res.ok) {
    let msg = `Request failed (HTTP ${res.status})`;
    try { const j = await res.json(); if (j.error?.message) msg = j.error.message; } catch {}
    throw new Error(msg);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith('data:')) continue;
      const data = l.slice(5).trim();
      if (!data || data === '[DONE]') continue;
      let j; try { j = JSON.parse(data); } catch { continue; }
      if (j.error) throw new Error(j.error.message || 'Model returned an error');
      const d = j.choices?.[0]?.delta || {};
      const r = d.reasoning ?? d.reasoning_content;
      if (r) assistantMsg.reasoning += r;
      if (d.content) assistantMsg.content += d.content;
      if (bodyEl) bodyEl.innerHTML = bodyHTML(assistantMsg);
      renderMath(bodyEl);
      const nearBottom = els.chat.scrollHeight - els.chat.scrollTop - els.chat.clientHeight < 120;
      if (nearBottom) els.chat.scrollTop = els.chat.scrollHeight;
    }
  }
}

async function runAssistant(assistantMsg) {
  const c = current();
  setBusy(true);
  renderAll();
  const bodyEl = els.col.querySelector(`.msg[data-index="${c.messages.indexOf(assistantMsg)}"] .body`);
  try {
    await streamInto(assistantMsg, bodyEl);
    if (!assistantMsg.content) assistantMsg.content = '_No response received. Try another model._';
    if (prefs.speak) speak(assistantMsg.content);
  } catch (err) {
    if (err.name === 'AbortError') {
      assistantMsg.content = assistantMsg.content || '_Stopped._';
    } else {
      assistantMsg.error = true;
      assistantMsg.content = `**Error:** ${err.message}`;
    }
  } finally {
    setBusy(false);
    abortCtrl = null;
    c.updated = Date.now();
    persist();
    renderAll();
  }
}

async function send(text) {
  text = (text ?? els.input.value).trim();
  if ((!text && !pending.length) || busy) return;
  if (!text) text = 'Please review the attached file(s).';
  stopSpeaking();
  els.input.value = ''; autosize();

  const files = pending;
  pending = [];
  renderAttachments();
  const shown = files.length
    ? `${text}\nAttached: ${files.map(f => f.name).join(', ')}`
    : text;
  const textFiles = files.filter(f => f.text !== undefined);
  const images = files.filter(f => f.image).map(f => f.image);
  const apiText = text + textFiles.map(f => `\n\n--- Attached file: ${f.name} ---\n${f.text}`).join('');

  const c = ensureCurrent();
  if (c.messages.length === 0) c.title = text.slice(0, 60);
  c.messages.push({ role: 'user', content: apiText, shown, images });
  const assistantMsg = { role: 'assistant', content: '', reasoning: '' };
  c.messages.push(assistantMsg);
  c.updated = Date.now();
  persist();
  await runAssistant(assistantMsg);
}

async function regenerate(index) {
  const c = current();
  c.messages = c.messages.slice(0, index);
  const assistantMsg = { role: 'assistant', content: '', reasoning: '' };
  c.messages.push(assistantMsg);
  persist();
  await runAssistant(assistantMsg);
}

els.send.addEventListener('click', () => busy ? abortCtrl?.abort() : send());

const XICON = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';

let pending = [];

// Resize images to at most 1280px and compress them, so chat storage stays small.
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}

function renderAttachments() {
  $('attachRow').innerHTML = pending.map((f, i) =>
    `<span class="file-chip"><span>${esc(f.name)}</span><button data-rm="${i}" title="Remove" aria-label="Remove">${XICON}</button></span>`
  ).join('');
}

$('fileInput').addEventListener('change', async () => {
  for (const f of $('fileInput').files) {

    try {
      if (f.type.startsWith('image/')) pending.push({ name: f.name, image: await shrinkImage(f) });
      else pending.push({ name: f.name, text: await f.text() });
    }
    catch { alert(`Could not read ${f.name}.`); }
  }
  $('fileInput').value = '';
  renderAttachments();
});

Object.assign(ICONS, {
  pin: '<svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
});
let chatQuery = '';
let oneShotModel = null;
let editingSkillId = null;
let mermaidSeq = 0;

function enc(s) {
  return encodeURIComponent(s).replace(/[*_~()!'`]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
}
function shortModel(id) { return id.replace(/:free$/, '').split('/').pop(); }

/* Math: $...$, $$...$$, \(...\) and \[...\] are swapped for placeholders, then rendered by KaTeX */
function protectMath(text) {
  return text.split(/(```[\s\S]*?```|`[^`\n]+`)/).map((part, i) => {
    if (i % 2 === 1) return part;
    return part
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => mathSlot(t, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => mathSlot(t, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => mathSlot(t, false))
      .replace(/\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (_, t) => mathSlot(t, false));
  }).join('');
}
function mathSlot(tex, display) {
  return `<span class="tex" data-display="${display ? 1 : 0}" data-tex="${enc(tex)}"></span>`;
}
function renderMath(root) {
  if (!window.katex || !root) return;
  root.querySelectorAll('span.tex:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    try { katex.render(decodeURIComponent(el.dataset.tex), el, { displayMode: el.dataset.display === '1', throwOnError: false }); }
    catch { el.textContent = decodeURIComponent(el.dataset.tex); }
  });
}

/* Diagrams: ```mermaid blocks */
async function renderMermaid(root) {
  if (!window.mermaid || !root) return;
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default' });
  for (const box of root.querySelectorAll('.mermaid-box:not([data-done])')) {
    box.dataset.done = '1';
    const src = decodeURIComponent(box.dataset.mmd);
    const id = 'mmd' + (++mermaidSeq);
    try {
      const { svg } = await mermaid.render(id, src);
      box.innerHTML = svg;
    } catch {
      box.innerHTML = `<pre class="mmd-error">${esc(src)}</pre>`;
      document.querySelectorAll(`[id^="d${id}"]`).forEach(n => n.remove());
    }
  }
}

/* "Other model" menu */
function showModelMenu(index, anchor) {
  if (busy) return;
  const menu = $('menuPop');
  menu.innerHTML = '<div class="pop-label">Try another model</div>' +
    MODELS.map(m => `<button class="pop-item" data-model="${esc(m.id)}"><span>${esc(m.name)}</span></button>`).join('');
  menu.dataset.index = index;
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 276)) + 'px';
  menu.style.top = 'auto';
  menu.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  menu.hidden = false;
}

$('menuPop').addEventListener('click', e => {

  const idx = +$('menuPop').dataset.index;

});
document.addEventListener('click', e => {

/* Export */
function exportChat(fmt) {
  const c = current();
  if (!c || !c.messages.length) return alert('Nothing to export yet.');
  const base = (c.title || 'volt-chat').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 50) || 'volt-chat';
  if (fmt === 'md') {
    const body = c.messages.map(m => `## ${m.role === 'user' ? 'You' : 'Volt'}\n\n${m.role === 'user' ? (m.shown ?? m.content) : m.content}`).join('\n\n');
    downloadFile({ name: base + '.md', text: `# ${c.title}\n\n${body}\n` });
  } else {
    downloadFile({
      name: base + '.json',
      text: JSON.stringify({
        title: c.title,
        exported: new Date().toISOString(),
        messages: c.messages.map(m => ({ role: m.role, content: m.shown ?? m.content, model: m.model }))
      }, null, 2)
    });
  }
}
$('exportMd').addEventListener('click', () => exportChat('md'));
$('exportJson').addEventListener('click', () => exportChat('json'));

/* Custom skills dialog */
function openSkillDialog(skill = null) {
  editingSkillId = skill ? skill.id : null;
  $('skillTitle').textContent = skill ? 'Edit skill' : 'Create a skill';
  $('skName').value = skill ? skill.name : '';
  $('skDesc').value = skill ? (skill.desc || '') : '';
  $('skPrompt').value = skill ? skill.prompt : '';
  $('skDelete').hidden = !(skill && skill.custom);
  $('skillDialog').showModal();
  $('skName').focus();
}
function saveSkill() {
  const name = $('skName').value.trim();
  const instructions = $('skPrompt').value.trim();
  if (!name || !instructions) return alert('Give the skill a name and some instructions.');
  const skill = {
    id: editingSkillId || 'c' + newId(),
    name: name.slice(0, 40),
    desc: $('skDesc').value.trim().slice(0, 80) || 'Custom skill',
    prompt: instructions,
    custom: true
  };
  prefs.customSkills = (prefs.customSkills || []).filter(s => s.id !== skill.id).concat(skill);
  prefs.skill = skill.id;
  persist();
  $('skillDialog').close();
  renderPopover();
  renderStatePills();
}
function deleteSkill() {
  if (!editingSkillId || !confirm('Delete this skill?')) return;
  prefs.customSkills = (prefs.customSkills || []).filter(s => s.id !== editingSkillId);
  if (prefs.skill === editingSkillId) prefs.skill = 'none';
  persist();
  $('skillDialog').close();
  renderPopover();
  renderStatePills();
}
$('skCancel').addEventListener('click', () => $('skillDialog').close());
$('skSave').addEventListener('click', saveSkill);
$('skDelete').addEventListener('click', deleteSkill);

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyK') { e.preventDefault(); $('chatSearch').focus(); }
  else if (mod && e.shiftKey && e.code === 'KeyO') { e.preventDefault(); newChat(); }

});

/* ============================ VOICE INPUT ============================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, listening = false, sendAfterVoice = false;

if (SR) {
  recognizer = new SR();
  recognizer.continuous = false;
  recognizer.interimResults = true;
  recognizer.lang = navigator.language || 'en-US';
  recognizer.onresult = e => {
    let t = '';
    for (const r of e.results) t += r[0].transcript;
    els.input.value = t; autosize();
  };
  recognizer.onend = () => {
    listening = false; els.mic.classList.remove('on');
    els.mic.title = 'Voice input';
    if (sendAfterVoice && els.input.value.trim()) send();
    sendAfterVoice = false;
  };
  recognizer.onerror = e => {
    listening = false; els.mic.classList.remove('on');
    if (e.error === 'not-allowed') alert('Microphone access was blocked. Allow it in your browser settings.');
  };
} else {
  els.mic.style.opacity = '.4';
  els.mic.title = 'Voice input needs Chrome or Edge';
}

els.mic.addEventListener('click', () => {
  if (!recognizer) return alert('Voice input is not supported in this browser. Try Chrome or Edge.');
  if (listening) { sendAfterVoice = true; recognizer.stop(); return; }
  stopSpeaking();
  sendAfterVoice = false;
  try { recognizer.start(); listening = true; els.mic.classList.add('on'); els.mic.title = 'Listening. Click to send'; }
  catch { /* already running */ }
});

/* ============================ VOICE OUTPUT ============================ */
function speak(text, force = false) {
  if (!('speechSynthesis' in window)) return;
  if (!prefs.speak && !force) return;
  const clean = text
    .replace(/```[\s\S]*?```/g, ' code omitted. ')
    .replace(/[*_#`>]/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.onstart = () => els.speaking.classList.add('show');
  u.onend = u.onerror = () => els.speaking.classList.remove('show');
  speechSynthesis.speak(u);
}
function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  els.speaking.classList.remove('show');
}
els.stopSpeak.addEventListener('click', stopSpeaking);
